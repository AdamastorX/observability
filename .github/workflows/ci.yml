name: ci

# backlog #117 (staff review 2026-08-09, §7.5): observability's first
# CI of any kind. ADR 0006 never scoped this repo -- it predates its
# current shape -- so this isn't a reversal of that decision the way
# adamastorx's own #97 CI was (see ADR 0006's addendum), just a real,
# previously-unexamined gap being closed for the first time.
on:
  pull_request:
  push:
    branches: [main]

env:
  YQ_VERSION: v4.44.3
  PROMTOOL_VERSION: v3.13.1

jobs:
  runbook-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: observability

      - uses: actions/checkout@v7
        with:
          repository: AdamastorX/platform
          path: platform

      - name: Install yq ${{ env.YQ_VERSION }}
        run: |
          curl -sSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Self-test -- checker must fail on a missing runbook and an unlisted one (#111 shape)
        run: |
          if bash observability/scripts/check-runbook-coverage.sh \
            observability/scripts/fixtures/runbook-coverage/platform \
            observability/scripts/fixtures/runbook-coverage/runbooks \
            observability/scripts/fixtures/runbook-coverage/runbooks/README.md; then
            echo "::error::checker did not fail on the deliberately-broken fixture"
            exit 1
          fi

      - name: Check the real runbook coverage
        run: bash observability/scripts/check-runbook-coverage.sh platform observability/runbooks observability/runbooks/README.md

  # backlog #143/#144 (ADR 0046): promtool check rules validates PromQL
  # syntax render-time, no live Prometheus needed; promtool test rules
  # unit-tests alert *logic* against synthetic series. Three real
  # defects of exactly this class (#91, #145, #143's own staleness
  # gate) shipped before this existed.
  prometheus-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: observability

      - uses: actions/checkout@v7
        with:
          repository: AdamastorX/platform
          path: platform

      - name: Install yq ${{ env.YQ_VERSION }}
        run: |
          curl -sSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Install promtool ${{ env.PROMTOOL_VERSION }}
        run: |
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/${PROMTOOL_VERSION}/prometheus-${PROMTOOL_VERSION#v}.linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin --strip-components=1 "prometheus-${PROMTOOL_VERSION#v}.linux-amd64/promtool"

      - name: Self-test -- check rules must fail on deliberately invalid PromQL
        run: |
          if promtool check rules observability/scripts/fixtures/prometheus-rules/broken-syntax/rules.yml; then
            echo "::error::checker did not fail on the deliberately-broken-syntax fixture"
            exit 1
          fi

      - name: Self-test -- test rules must fail on a deliberately wrong expectation
        run: |
          if promtool test rules observability/scripts/fixtures/prometheus-rules/wrong-test/test.yml; then
            echo "::error::checker did not fail on the deliberately-wrong-test fixture"
            exit 1
          fi

      - name: Check and test the real alerting rules
        run: bash observability/scripts/check-prometheus-rules.sh platform observability/tests/rules-under-test.yml observability/tests/alerting_rules_test.yml observability/tests/recording_rules_test.yml

  # backlog #66/ADR 0039: no network call, no API key needed -- proves
  # every bundle is well-formed and that reference_answer (the real
  # answer) never leaks into what actually gets sent to the model, the
  # harness's entire integrity guarantee.
  sre-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r sre-agent/requirements.txt

      - name: Run structural tests
        run: python3 sre-agent/test_harness.py

  ci:
    needs: [runbook-coverage, prometheus-rules, sre-agent-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.runbook-coverage.result }}" != "success" ] \
            || [ "${{ needs.prometheus-rules.result }}" != "success" ] \
            || [ "${{ needs.sre-agent-tests.result }}" != "success" ]; then
            echo "One or more jobs failed:"
            echo "  runbook-coverage: ${{ needs.runbook-coverage.result }}"
            echo "  prometheus-rules: ${{ needs.prometheus-rules.result }}"
            echo "  sre-agent-tests: ${{ needs.sre-agent-tests.result }}"
            exit 1
          fi
          echo "All jobs succeeded."
